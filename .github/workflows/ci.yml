name: CI and Release

# 触发条件：任何推送（包括分支和标签）
on: [push]

# 并发控制：同一分支或标签的旧运行会被取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-maybe-release:
    runs-on: windows-latest

    # 设置必要的权限，用于创建 Release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 获取完整历史，确保标签对象被下载

      # 配置 CMake（强制 UTF-8 编码）
      - name: Configure CMake
        run: cmake -B build -A x64 -DCMAKE_CXX_FLAGS="/utf-8"

      # 构建 Release 版本
      - name: Build
        run: cmake --build build --config Release --parallel

      # 运行 Python 打包脚本（失败则终止，避免发布无附件）
      - name: Run Python helper scripts
        run: python bin/Pack.py

      # 上传构建产物（仅标签或 main 分支）
      - name: Upload artifacts
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs-${{ github.sha }}
          path: |
            bin/Output/
            bin/MulNX.zip
            bin/MulNX/
          if-no-files-found: warn

      # 如果是标签推送，准备 Release 信息（包含时间戳）
      - name: Prepare release info
        if: github.ref_type == 'tag'
        id: release_info
        shell: bash
        run: |
          # 生成北京时间时间戳
          TS=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')
          echo "now=$TS" >> $GITHUB_OUTPUT

          TAG_NAME="${{ github.ref_name }}"

          # 判断标签类型：注解标签 vs 轻量标签
          if [ "$(git cat-file -t "$TAG_NAME")" = "tag" ]; then
            MSG=$(git tag -l --format='%(contents)' "$TAG_NAME")
          else
            MSG="自动构建的 Release，版本：$TAG_NAME"
          fi

          # 将消息与构建时间写入文件
          printf '%s\n' "$MSG" > tag_body.txt
          printf '\n构建时间：%s\n' "$TS" >> tag_body.txt

      # 如果是标签推送，则创建 GitHub Release 并上传文件
      - name: Create GitHub Release (only for tags)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # Release 标题中包含时间戳
          name: Release ${{ github.ref_name }} (${{ steps.release_info.outputs.now }})
          # 从文件读取 Release 说明（包含原始标签消息和构建时间）
          body_path: tag_body.txt
          # 要上传的文件列表
          files: bin/MulNX.zip
          # 确保附件存在，否则失败
          fail_on_unmatched_files: true
          # 是否为预发布版本（根据需要调整）
          prerelease: false
          # 是否为草稿
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}