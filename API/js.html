<!doctype html>
<html lang="zh">

<head>
    <meta charset="utf-8" />
    <title>MulNX WS 测试 (type/payload)</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 16px;
            background: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
        }

        input,
        textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            font-family: monospace;
            margin-bottom: 12px;
        }

        button {
            padding: 6px 12px;
            margin-right: 8px;
            margin-bottom: 12px;
        }

        .log-box {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 8px;
            height: 200px;
            overflow: auto;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3>WebSocket 测试</h3>
        <div style="display:flex; gap:8px;">
            <input id="url" value="ws://localhost:55202" style="flex:3" />
            <button id="connectBtn">连接</button>
            <button id="disconnectBtn" disabled>断开</button>
            <button id="clearLogBtn">清日志</button>
        </div>

        <hr />
        <label for="msgType">type</label>
        <input id="msgType" value="TestCommand" />

        <label for="payload">payload</label>
        <textarea id="payload" rows="3">hello world</textarea>

        <div>
            <strong>发送的 JSON：</strong>
            <pre id="jsonPreview" style="background:#f0f0f0; padding:6px; min-height:30px;"></pre>
        </div>

        <button id="sendMsgBtn">📨 发送 JSON</button>

        <h4>📡 日志</h4>
        <div id="log" class="log-box"></div>
    </div>

    <script>
        (function () {
            "use strict";

            const urlInput = document.getElementById('url');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const clearLogBtn = document.getElementById('clearLogBtn');
            const sendMsgBtn = document.getElementById('sendMsgBtn');
            const logEl = document.getElementById('log');
            const msgType = document.getElementById('msgType');
            const payload = document.getElementById('payload');
            const jsonPreview = document.getElementById('jsonPreview');

            let ws = null;

            function log(...args) {
                const time = new Date().toLocaleTimeString();
                logEl.textContent += `[${time}] ${args.join(' ')}\n`;
                logEl.scrollTop = logEl.scrollHeight;
            }

            function updatePreview() {
                const obj = {
                    type: msgType.value,
                    payload: payload.value
                };
                jsonPreview.textContent = JSON.stringify(obj, null, 2);
            }

            msgType.addEventListener('input', updatePreview);
            payload.addEventListener('input', updatePreview);
            updatePreview();

            connectBtn.addEventListener('click', () => {
                const url = urlInput.value.trim();
                if (!url) return;
                ws = new WebSocket(url);
                log(`连接中: ${url}`);
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                ws.onopen = () => log('✅ 已连接');
                ws.onmessage = (ev) => log('📩', ev.data);
                ws.onerror = () => log('❌ 错误');
                ws.onclose = (ev) => {
                    log(`断开 (${ev.code})`);
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    ws = null;
                };
            });

            disconnectBtn.addEventListener('click', () => ws && ws.close());
            clearLogBtn.addEventListener('click', () => logEl.textContent = '');

            sendMsgBtn.addEventListener('click', () => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return log('未连接');
                const json = JSON.stringify({
                    type: msgType.value,
                    payload: payload.value
                });
                ws.send(json);
                log('📤 发送:', json);
            });
        })();
    </script>
</body>

</html>
