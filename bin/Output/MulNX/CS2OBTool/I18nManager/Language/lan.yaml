disclaimer: |
  欢迎使用MulNX，这是一款运行于-insecure模式的综合内容增强工具。
  在MulNX中，存在一些“作弊”模块，常常用于验证程序实现正确性。
  但请注意，在正常情况下，您无法使用MulNX进行作弊，也奉劝您打消作弊想法，否则后果自负！

