    connect:
      please_try: |
        当前尚未连接OBS，请尝试连接
        关于OBS连接：
          1.确保OBS已经运行
          2.标题栏-工具（T）-WebSocket 服务器设置
          3.开启 WebSocket 服务器
          4.服务器端口号应保持OBS默认端口：4455
          5.取消勾选 开启身份认证
          6.应用，随后尝试连接
      try: 尝试连接
      succ: 成功连接OBS WebSocket接口！身份认证成功 (Identified)！
